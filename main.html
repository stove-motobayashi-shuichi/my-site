<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- モバイル用タブ -->
    <nav class="mobile-nav">
      <button data-target="profile" class="active">Profile</button>
      <button data-target="portfolio">Portfolio</button>
      <button data-target="youtube">YouTube</button>
    </nav>

    <div class="layout">
      <!-- プロフィール -->
      <section class="panel profile active">
        <div class="glass">
          <h2>Profile</h2>
          <p>自己紹介やサイト説明など</p>
        </div>
      </section>

      <!-- ポートフォリオ -->
      <section class="panel portfolio">
        <div class="glass">
          <h2>Portfolio</h2>

          <div class="grid">
            <div class="item">作品1</div>
            <div class="item">作品2</div>
            <div class="item">作品3</div>
            <div class="item">作品4</div>
          </div>
        </div>
      </section>

      <!-- YouTube -->
      <section class="panel youtube">
        <div class="glass">
          <h2>YouTube</h2>
          <p>動画リンクや埋め込み</p>
        </div>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
